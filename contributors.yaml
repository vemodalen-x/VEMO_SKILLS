# VEMO_SKILLS · Contribution Ledger (hub-wide, identity-free)
#
# The single cross-skill cumulative tally that the `skill-announce` ranking table (🏆 累计贡献排行榜) reads.
# This is a HUB fact: it travels with the repo and is reusable by any consumer. It is IDENTITY-FREE by design —
# it keys by a stable contributor LABEL, never an org-specific id (open_id / account). The label→open_id map for
# @-mentions lives in the CONSUMING PROJECT's instance (`skill_hub.announce.contributor_open_id`), not here, so the
# hub ledger stays decoupled (skill_spec §9).
#
# Each entry: a contributor label + their list of contributions (item + source-type + date).
#   source: feishu | pr   (how the contribution arrived; an org-neutral channel type, not an id)
# `skill-announce` aggregates count = len(contributions) per contributor to rank the leaderboard.

